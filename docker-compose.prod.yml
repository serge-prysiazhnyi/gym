services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Not used directly by the app (it connects via DATABASE_URL above) —
      # only forwarded because config validation in app.module.ts requires them.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to loopback only. Docker's iptables rules bypass UFW, so a plain
      # '3000:3000' would be publicly reachable regardless of the firewall.
      # Put a TLS-terminating reverse proxy (nginx/Caddy/Traefik) in front.
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      # Loopback only - Prometheus has no auth. Reach it via SSH tunnel:
      #   ssh -L 9090:localhost:9090 <vps>
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      # Loopback only. Expose through the reverse proxy or an SSH tunnel:
      #   ssh -L 3001:localhost:3001 <vps>
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
